[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton-framework"
version = "0.1.1"
description = "A full-stack app framework: Python orchestration + FastAPI + WebPack frontend."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]

authors = [
    { name = "lambdadotjoburg", email = "lambdadotjoburg@gmail.com" }
]

dependencies = [
    "uvicorn",
    "fastapi",
    "httpx",
    "watchfiles",
]

[project.scripts]
skeleton = "skeleton.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skeleton*"]
namespaces = false

[tool.setuptools.package-data]
skeleton = [
    "infrastructure/**/*.json",
    "infrastructure/bootstrap/src/templates/**/*",
    "infrastructure/bootstrap/src/templates/config/.gitignore",
    "packages/.skeleton/*.tgz",
]

[project.urls]
Homepage = "https://github.com/lambdadotjoburg/skeleton"
Repository = "https://github.com/lambdadotjoburg/skeleton"
Issues = "https://github.com/lambdadotjoburg/skeleton/issues"